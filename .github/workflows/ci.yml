name: Driver tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    name: Driver glue / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    container: emscripten/emsdk:6.0.6
    timeout-minutes: 10
    env:
      CC: emcc
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.5.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
